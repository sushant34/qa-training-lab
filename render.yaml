services:
  - type: web
    name: qa-training-lab
    runtime: node
    buildCommand: npm install && cd server && npm install && cd ../client && npm install && ./node_modules/.bin/vite build
    startCommand: cd server && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
